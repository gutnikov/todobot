# todobot — Event Model: the skeleton (SK), and what later requirements add to it (DUP, ERR, ACC, CAP), each element tracing
# to its requirement in `reqs`.
# Format: agentify's parts/event-model/format.md. Checks: the layers in agentify/specs/layers.yaml.
#
# Screens are where a person or a test sees a result: the user's chat with the bot, the inbox as the tests read it
# (SK#2's seam, the table inbox), GET /healthz, and the log (stdout of `serve`; Railway's logs in production).
# <APP_VERSION> stands for the version the bot runs with: the tests set it.
#
# A decision table in `rules:` decides every combination of its inputs' domains. A combination nobody decided yet
# is listed under the table's `undecided: [{inputs: [...], question: "..."}]`, never given a value.
#
# Tests are tagged and titled with an example: `test_<tag>_<example name>`, where <tag> is the slice id (s02) or one
# of the example's requirements (sk2), and the name is the example's in lower case with every run of other
# characters as one `_`. The acceptance gate matches them that way (agentify/loops/acceptance-gate/LOOP.md).

system: todobot
actors: [User, Operator]
externals:
  # outcome -> the e2e fixture that forces it
  Database:
    outcomes:
      answers: migratedDatabase          # a fresh database, migrated
      doesNotAnswer: closedPortDatabase  # DATABASE_URL points to a port nothing listens on
      storingFails: unmigratedDatabase   # a fresh database where migrate has not run: SK#5's trigger
  PostHog:
    outcomes:
      takes: fakePostHog                 # a fake PostHog at POSTHOG_HOST that records every request and takes it
      refuses: refusingPostHog           # a fake PostHog at POSTHOG_HOST that answers every request with 500
clock: false

screens:
  Chat: {route: "the user's private chat with the bot: the Bot API's sendMessage calls to it", pom: chat}
  Inbox: {route: "the table inbox, read by the tests (SK#2)", pom: inbox}
  Healthz: {route: "GET /healthz", pom: healthz}
  Log: {route: "stdout of `serve`, one line per log line; Railway's logs in production", pom: log}
  TaskStore: {route: "the table tasks, read by the tests (CAP#1)", pom: taskStore}
  ErrorTracking: {route: "what PostHog receives: in tests the fake at POSTHOG_HOST; in production the project 344747 of the organization todobot (EU)", pom: posthog}

states:
  runningBot:
    given: []
    note: "`serve` runs with APP_VERSION set; the fake Bot API answers every call; nobody has written yet. The
      database is the example's Database outcome. The user is Анна, Telegram id 5812345678, unless the state says
      otherwise."
  borisSavedAMessage:
    extends: runningBot
    given: [InboxSaved]
    note: "Борис, Telegram id 402117993, sent the text «Забрать посылку»: one inbox item, under his id."
  borisUpdateComesAgain:
    extends: borisSavedAMessage
    given: [InboxSaved]
    note: "Telegram got no answer for the update with Борис's «Забрать посылку» and sends that same update again: the
      same update_id, chat and message id (DUP#1)."
  runningBotWithErrorTracking:
    extends: runningBot
    given: []
    note: "serve runs with POSTHOG_PROJECT_TOKEN and POSTHOG_HOST set: PostHog is the example's PostHog outcome.
      Without them serve sends PostHog nothing, as in every SK and DUP example."
  closedBot:
    extends: runningBot
    given: []
    note: "serve runs with TELEGRAM_ALLOWED_USER_IDS naming Анна (5812345678) only: the bot is closed to every other
      user. The example's message comes from Анна."
  closedBotStrangerWrites:
    extends: closedBot
    given: []
    note: "As closedBot, and the example's message comes from Борис (402117993), whom the allow list does not name."
  annaRecordedTwoTasks:
    extends: runningBot
    given: [TaskRecorded, TaskRecorded]
    note: "Анна (5812345678) wrote «Сделать поверку счётчиков», then «Записаться к стоматологу»: two tasks, both
      «записана», in that order."
  borisAsksAfterAnnasTasks:
    extends: annaRecordedTwoTasks
    given: []
    note: "As annaRecordedTwoTasks, and the example's /tasks comes from Борис (402117993), who recorded nothing."
  annaRecordedManyLongTasks:
    extends: runningBot
    given: [TaskRecorded]
    note: "Анна recorded 40 tasks, each a text of 300 characters, so her list is longer than one Telegram message
      (4096 characters)."
  annaHitAHandlerError:
    extends: runningBotWithErrorTracking
    given: [HandlerFailed]
    note: "The database was not migrated (Database: storingFails). Анна, Telegram id 5812345678, sent «Купить молоко
      и хлеб», storing it failed, a handler_error line was written and she got the apology."
  afterHandlerError:
    extends: runningBot
    given: [HandlerFailed]
    note: "The database was not migrated (Database: storingFails). Анна sent «Купить молоко и хлеб», storing it
      failed and she got the apology. The next message comes from Борис, Telegram id 402117993."

domains:
  MessageHas: [text, voice, photo, anything else]
  Outcome: [started, saved, failed, refused]
  MessageIs: [plain text, command, voice, photo, anything else]
  DatabaseCheck: [answers, does not answer]

rules:
  inbox-item:
    kind: table
    inputs: [MessageHas]
    output: "the inbox item's kind, text and file_id"
    reqs: [SK#2]
    rows:
      - [text, {kind: text, text: "the text", file_id: "NULL"}]
      - [voice, {kind: voice, text: "the caption or NULL", file_id: "voice.file_id"}]
      - [photo, {kind: photo, text: "the caption or NULL", file_id: "file_id of the largest PhotoSize (the last in the array)"}]
      - [anything else, {kind: other, text: "the caption or NULL", file_id: "NULL"}]
  reply:
    kind: table
    inputs: [Outcome]
    output: "the text the bot sends to the chat, exactly"
    reqs: [SK#1, SK#2, SK#5, ACC#1]
    rows:
      - [started, "Привет! Присылай задачи текстом, голосом или картинкой — я их сохраню."]
      - [saved, "Сохранил ✅"]
      - [failed, "Что-то пошло не так, попробуй ещё раз."]
      - [refused, "Извини, бот пока закрыт."]
  becomes-task:
    kind: table
    inputs: [MessageIs]
    output: "whether the message also becomes a task, and its status"
    reqs: [CAP#1]
    rows:
      - [plain text, {task: yes, status: записана}]
      - [command, {task: no}]
      - [voice, {task: no}]
      - [photo, {task: no}]
      - [anything else, {task: no}]
  health:
    kind: table
    inputs: [DatabaseCheck]
    output: "the HTTP status and the JSON body of GET /healthz"
    reqs: [SK#4]
    rows:
      - [answers, {status: 200, body: {status: ok, version: "<APP_VERSION>"}}]
      - [does not answer, {status: 503, body: {status: error}, note: "more fields allowed"}]

slices:
  # ---------------------------------------------------------------- the user's side: /start, messages, the inbox
  - id: S01
    name: Start the bot
    type: command
    actor: User
    screen: Chat
    reqs: [SK#1]
    rules: [reply]
    command:
      name: SendStart
      fields: {user_id: system}
    errors: []
    events:
      Started:
        stream: User
        fields: {user_id: cmd}
    specs:
      - name: /start replies with greeting within 5 seconds
        given: runningBot
        covers: [rule:reply/started]
        then:
          events: [Started]
          see:
            - {screen: Chat, field: Reply.text, is: "Привет! Присылай задачи текстом, голосом или картинкой — я их сохраню.", within_seconds: 5}
            - {screen: Chat, field: Reply.chat, is: "Анна's chat, 5812345678"}
      - name: /start writes start log line with version
        given: runningBot
        then:
          events: [Started]
          see:
            - {screen: Log, field: LogLine.event, is: start}
            - {screen: Log, field: LogLine.version, is: "<APP_VERSION>"}
      - name: stranger's /start is refused
        given: closedBotStrangerWrites
        covers: [rule:reply/refused]
        reqs: [ACC#1]
        then:
          see:
            - {screen: Chat, field: Reply.text, is: "Извини, бот пока закрыт., and no greeting"}
            - {screen: Chat, field: Reply.chat, is: "Борис's chat, 402117993"}
            - {screen: Log, field: LogLine.event, is: access_denied}
    # Answered in SK.yaml: no failure example for /start (SK?3); Telegram refusing a reply (SK?6), groups, channels
    # and edited messages (SK?7) are out of SK.

  - id: V01
    name: The chat
    type: view
    reqs: [SK#1, SK#2, SK#5, CAP#2]
    read_model:
      name: Reply
      fields:
        chat: [Started.user_id, InboxSaved.user_id, HandlerFailed.user_id]
        text: [rule:reply, TasksListed]
    screens: [Chat]

  - id: S02
    name: Send a message
    type: command
    actor: User
    screen: Chat
    # No slice-level reqs: its examples serve SK#2 or SK#5, and each says which.
    rules: [inbox-item, reply]
    command:
      name: SendMessage
      fields: {user_id: system, content: input, text: input, caption: input}
    errors: []
    events:
      InboxSaved:
        stream: Inbox
        fields: {user_id: cmd, kind: "rule:inbox-item", text: "rule:inbox-item", file_id: "rule:inbox-item", received_at: system}
      HandlerFailed:
        stream: Update
        fields: {user_id: cmd}
      RepeatIgnored:
        stream: Update
        fields: {user_id: cmd}
      AccessRefused:
        stream: Update
        fields: {user_id: cmd}
      TaskRecorded:
        stream: Task
        fields: {user_id: cmd, text: cmd, status: "rule:becomes-task", created_at: system}
    specs:
      - name: text message is saved as text and acknowledged
        given: runningBot
        when: {content: text, text: "Купить молоко и хлеб"}
        external: {Database: answers}
        covers: [rule:inbox-item/text, rule:reply/saved]
        reqs: [SK#2]
        then:
          events: [InboxSaved]
          see:
            - {screen: Chat, field: Reply.text, is: "Сохранил ✅"}
            - {screen: Chat, field: Reply.chat, is: "Анна's chat, 5812345678"}
            - {screen: Inbox, field: InboxItem.user_id, is: 5812345678}
            - {screen: Inbox, field: InboxItem.kind, is: text}
            - {screen: Inbox, field: InboxItem.text, is: "Купить молоко и хлеб"}
            - {screen: Inbox, field: InboxItem.file_id, is: "NULL"}
            - {screen: Inbox, field: InboxItem.received_at, is: "the time the message came, with a time zone: the server's time or the message's date"}
      - name: other command is saved as text
        given: runningBot
        when: {content: text, text: "/help"}
        external: {Database: answers}
        covers: [rule:inbox-item/text]
        reqs: [SK#2]
        then:
          events: [InboxSaved]
          see:
            - {screen: Chat, field: Reply.text, is: "Сохранил ✅"}
            - {screen: Inbox, field: InboxItem.kind, is: text}
            - {screen: Inbox, field: InboxItem.text, is: "/help"}
            - {screen: Inbox, field: InboxItem.file_id, is: "NULL"}
      - name: voice without caption is saved with its file id
        given: runningBot
        when: {content: voice}
        external: {Database: answers}
        covers: [rule:inbox-item/voice]
        reqs: [SK#2]
        then:
          events: [InboxSaved]
          see:
            - {screen: Chat, field: Reply.text, is: "Сохранил ✅"}
            - {screen: Inbox, field: InboxItem.kind, is: voice}
            - {screen: Inbox, field: InboxItem.text, is: "NULL"}
            - {screen: Inbox, field: InboxItem.file_id, is: "the voice note's file_id"}
      - name: voice with caption is saved with the caption
        given: runningBot
        when: {content: voice, caption: "Позвонить маме вечером"}
        external: {Database: answers}
        covers: [rule:inbox-item/voice]
        reqs: [SK#2]
        then:
          events: [InboxSaved]
          see:
            - {screen: Chat, field: Reply.text, is: "Сохранил ✅"}
            - {screen: Inbox, field: InboxItem.kind, is: voice}
            - {screen: Inbox, field: InboxItem.text, is: "Позвонить маме вечером"}
            - {screen: Inbox, field: InboxItem.file_id, is: "the voice note's file_id"}
      - name: photo is saved with file id of the last photo size
        given: runningBot
        when: {content: photo, caption: "Чек из аптеки — вернуть до пятницы"}
        external: {Database: answers}
        covers: [rule:inbox-item/photo]
        reqs: [SK#2]
        then:
          events: [InboxSaved]
          see:
            - {screen: Chat, field: Reply.text, is: "Сохранил ✅"}
            - {screen: Inbox, field: InboxItem.kind, is: photo}
            - {screen: Inbox, field: InboxItem.text, is: "Чек из аптеки — вернуть до пятницы"}
            - {screen: Inbox, field: InboxItem.file_id, is: "the file_id of the photo's largest size, the last in its array"}
      - name: photo without caption is saved with null text
        given: runningBot
        when: {content: photo}
        external: {Database: answers}
        covers: [rule:inbox-item/photo]
        reqs: [SK#2]
        then:
          events: [InboxSaved]
          see:
            - {screen: Chat, field: Reply.text, is: "Сохранил ✅"}
            - {screen: Inbox, field: InboxItem.kind, is: photo}
            - {screen: Inbox, field: InboxItem.text, is: "NULL"}
      - name: sticker is saved as other without text or file id
        given: runningBot
        when: {content: sticker}
        external: {Database: answers}
        covers: [rule:inbox-item/anything else]
        reqs: [SK#2]
        then:
          events: [InboxSaved]
          see:
            - {screen: Chat, field: Reply.text, is: "Сохранил ✅"}
            - {screen: Inbox, field: InboxItem.kind, is: other}
            - {screen: Inbox, field: InboxItem.text, is: "NULL"}
            - {screen: Inbox, field: InboxItem.file_id, is: "NULL"}
      - name: document with caption is saved as other with the caption
        given: runningBot
        when: {content: document, caption: "Список на выходные"}
        external: {Database: answers}
        covers: [rule:inbox-item/anything else]
        reqs: [SK#2]
        then:
          events: [InboxSaved]
          see:
            - {screen: Chat, field: Reply.text, is: "Сохранил ✅"}
            - {screen: Inbox, field: InboxItem.kind, is: other}
            - {screen: Inbox, field: InboxItem.text, is: "Список на выходные"}
            - {screen: Inbox, field: InboxItem.file_id, is: "NULL"}
      - name: messages of two users are stored under their own user id
        given: borisSavedAMessage
        when: {content: text, text: "Записаться к стоматологу"}
        external: {Database: answers}
        reqs: [SK#2]
        then:
          events: [InboxSaved]
          see:
            - {screen: Chat, field: Reply.chat, is: "Анна's chat, 5812345678, not Борис's"}
            - {screen: Inbox, field: InboxItem.user_id, is: "5812345678 for «Записаться к стоматологу», 402117993 for «Забрать посылку»"}
      - name: inbox_saved log line has kind and version
        given: runningBot
        when: {content: photo}
        external: {Database: answers}
        reqs: [SK#2]
        then:
          events: [InboxSaved]
          see:
            - {screen: Log, field: LogLine.event, is: inbox_saved}
            - {screen: Log, field: LogLine.kind, is: photo}
            - {screen: Log, field: LogLine.version, is: "<APP_VERSION>"}
      - name: every stdout line is JSON with level, event, version
        given: runningBot
        when: {content: text, text: "Купить молоко и хлеб"}
        external: {Database: answers}
        reqs: [SK#5]
        then:
          events: [InboxSaved]
          see:
            - {screen: Log, field: LogLine.format, is: "one JSON object on every line of stdout"}
            - {screen: Log, field: LogLine.level, is: "present on every line"}
            - {screen: Log, field: LogLine.event, is: "present on every line"}
            - {screen: Log, field: LogLine.version, is: "<APP_VERSION> on every line"}
      - name: handler error writes error line and sends apology
        given: runningBot
        when: {content: text, text: "Купить молоко и хлеб"}
        external: {Database: storingFails}
        covers: [rule:reply/failed]
        reqs: [SK#5]
        then:
          events: [HandlerFailed]
          see:
            - {screen: Chat, field: Reply.text, is: "Что-то пошло не так, попробуй ещё раз."}
            - {screen: Log, field: LogLine.level, is: ERROR}
            - {screen: Log, field: LogLine.event, is: handler_error}
            - {screen: Log, field: LogLine.version, is: "<APP_VERSION>"}
      - name: stdout stays JSON lines when a handler fails
        given: runningBot
        when: {content: text, text: "Купить молоко и хлеб"}
        external: {Database: storingFails}
        reqs: [SK#5]
        then:
          events: [HandlerFailed]
          see:
            - {screen: Log, field: LogLine.format, is: "one JSON object on every line of stdout"}
            - {screen: Log, field: LogLine.version, is: "<APP_VERSION> on every line"}
      - name: process keeps handling updates and /healthz after handler error
        given: afterHandlerError
        when: {content: text, text: "Забрать посылку"}
        external: {Database: storingFails}
        reqs: [SK#5]
        then:
          events: [HandlerFailed]
          see:
            - {screen: Chat, field: Reply.text, is: "Что-то пошло не так, попробуй ещё раз."}
            - {screen: Chat, field: Reply.chat, is: "Борис's chat, 402117993"}
            - {screen: Healthz, field: Health.http_status, is: 200}
            - {screen: Healthz, field: Health.status, is: ok}
      # ------------------------------------------------ DUP: one inbox item per message, and no message lost
      - name: repeated update is kept once and not replied to again
        given: borisUpdateComesAgain
        when: {content: text, text: "Забрать посылку"}
        external: {Database: answers}
        reqs: [DUP#1]
        then:
          events: [RepeatIgnored]
          see:
            - {screen: Inbox, field: InboxItem.text, is: "«Забрать посылку» once: one inbox item under 402117993"}
            - {screen: Chat, field: Reply.text, is: "«Сохранил ✅» once in Борис's chat: nothing for the repeated update"}
            - {screen: Log, field: LogLine.event, is: inbox_repeat}
            - {screen: Log, field: LogLine.version, is: "<APP_VERSION>"}
      - name: new message with the same text is saved again
        given: borisSavedAMessage
        when: {content: text, text: "Забрать посылку"}
        external: {Database: answers}
        reqs: [DUP#1]
        then:
          events: [InboxSaved]
          see:
            - {screen: Inbox, field: InboxItem.text, is: "«Забрать посылку» twice under 402117993: a new message id is a new message"}
            - {screen: Chat, field: Reply.text, is: "Сохранил ✅"}
      - name: webhook answers after the message is stored and the reply sent
        given: runningBot
        when: {content: text, text: "Купить молоко и хлеб"}
        external: {Database: answers}
        reqs: [DUP#2]
        then:
          events: [InboxSaved]
          see:
            - {screen: Inbox, field: InboxItem.text, is: "Купить молоко и хлеб, stored before the webhook answers 200"}
            - {screen: Chat, field: Reply.text, is: "Сохранил ✅, sent before the webhook answers 200"}
      - name: webhook answers after the apology when storing fails
        given: runningBot
        when: {content: text, text: "Купить молоко и хлеб"}
        external: {Database: storingFails}
        reqs: [DUP#2]
        then:
          events: [HandlerFailed]
          see:
            - {screen: Chat, field: Reply.text, is: "Что-то пошло не так, попробуй ещё раз., sent before the webhook answers 200"}
      # ------------------------------------------------ ERR: todobot's errors in PostHog
      - name: saved message sends PostHog nothing
        given: runningBotWithErrorTracking
        when: {content: text, text: "Купить молоко и хлеб"}
        external: {Database: answers, PostHog: takes}
        reqs: [ERR#1]
        then:
          events: [InboxSaved]
          see:
            - {screen: Chat, field: Reply.text, is: "Сохранил ✅"}
            - {screen: ErrorTracking, field: TrackedEvent.event, is: "server_started only: nothing for the message"}
      # ------------------------------------------------ ACC: the bot only for its owner
      - name: stranger's message is refused and not stored
        given: closedBotStrangerWrites
        when: {content: text, text: "Забрать посылку"}
        external: {Database: answers}
        covers: [rule:reply/refused]
        reqs: [ACC#1]
        then:
          events: [AccessRefused]
          see:
            - {screen: Chat, field: Reply.text, is: "Извини, бот пока закрыт."}
            - {screen: Chat, field: Reply.chat, is: "Борис's chat, 402117993"}
            - {screen: Inbox, field: InboxItem.user_id, is: "no inbox item under 402117993"}
            - {screen: Log, field: LogLine.event, is: access_denied}
      - name: listed user's message is saved as before
        given: closedBot
        when: {content: text, text: "Купить молоко и хлеб"}
        external: {Database: answers}
        covers: [rule:reply/saved]
        reqs: [ACC#1]
        then:
          events: [InboxSaved]
          see:
            - {screen: Chat, field: Reply.text, is: "Сохранил ✅"}
            - {screen: Inbox, field: InboxItem.user_id, is: 5812345678}
            - {screen: Inbox, field: InboxItem.text, is: "Купить молоко и хлеб"}
      # ------------------------------------------------ CAP: recording a task
      - name: plain text becomes a recorded task
        given: runningBot
        when: {content: text, text: "Сделать поверку счётчиков"}
        external: {Database: answers}
        covers: [rule:becomes-task/plain text]
        reqs: [CAP#1]
        then:
          events: [InboxSaved, TaskRecorded]
          see:
            - {screen: Chat, field: Reply.text, is: "Сохранил ✅"}
            - {screen: TaskStore, field: Task.text, is: "Сделать поверку счётчиков"}
            - {screen: TaskStore, field: Task.status, is: recorded}
            - {screen: TaskStore, field: Task.user_id, is: 5812345678}
            - {screen: TaskStore, field: Task.created_at, is: "the time the message came, with a time zone"}
            - {screen: Inbox, field: InboxItem.text, is: "Сделать поверку счётчиков"}
            - {screen: Log, field: LogLine.event, is: task_recorded}
      - name: command is not a task
        given: runningBot
        when: {content: text, text: "/help"}
        external: {Database: answers}
        covers: [rule:becomes-task/command]
        reqs: [CAP#1]
        then:
          events: [InboxSaved]
          see:
            - {screen: Chat, field: Reply.text, is: "Сохранил ✅"}
            - {screen: TaskStore, field: Task.text, is: "no task"}
            - {screen: Inbox, field: InboxItem.text, is: "/help"}
      - name: voice note is not a task
        given: runningBot
        when: {content: voice}
        external: {Database: answers}
        covers: [rule:becomes-task/voice]
        reqs: [CAP#1]
        then:
          events: [InboxSaved]
          see:
            - {screen: TaskStore, field: Task.text, is: "no task"}
            - {screen: Inbox, field: InboxItem.kind, is: voice}
      - name: photo is not a task
        given: runningBot
        when: {content: photo, caption: "Чек из аптеки — вернуть до пятницы"}
        external: {Database: answers}
        covers: [rule:becomes-task/photo]
        reqs: [CAP#1]
        then:
          events: [InboxSaved]
          see:
            - {screen: TaskStore, field: Task.text, is: "no task"}
      - name: sticker is not a task
        given: runningBot
        when: {content: sticker}
        external: {Database: answers}
        covers: [rule:becomes-task/anything else]
        reqs: [CAP#1]
        then:
          events: [InboxSaved]
          see:
            - {screen: TaskStore, field: Task.text, is: "no task"}
      - name: message with several things is one task
        given: runningBot
        when: {content: text, text: "Купить молоко\nПозвонить маме"}
        external: {Database: answers}
        reqs: [CAP#1]
        then:
          events: [InboxSaved, TaskRecorded]
          see:
            - {screen: TaskStore, field: Task.text, is: "one task: «Купить молоко\nПозвонить маме»"}
      - name: repeated update makes no second task
        given: borisUpdateComesAgain
        when: {content: text, text: "Забрать посылку"}
        external: {Database: answers}
        reqs: [CAP#1]
        then:
          events: [RepeatIgnored]
          see:
            - {screen: TaskStore, field: Task.text, is: "«Забрать посылку» once under 402117993"}
    # Answered in SK.yaml: no deadline for «Сохранил ✅» (SK?4). A repeated update is DUP's (SK?5).

  - id: S05
    name: List tasks
    type: command
    actor: User
    screen: Chat
    # No slice-level reqs: each example says which requirement it serves.
    command:
      name: ListTasks
      fields: {user_id: system}
    errors: []
    events:
      TasksListed:
        stream: Task
        fields: {user_id: cmd}
    specs:
      - name: tasks list shows recorded tasks oldest first
        given: annaRecordedTwoTasks
        reqs: [CAP#2]
        then:
          events: [TasksListed]
          see:
            - {screen: Chat, field: Reply.text, is: "Твои задачи:\n1. Сделать поверку счётчиков — записана\n2. Записаться к стоматологу — записана"}
            - {screen: Log, field: LogLine.event, is: tasks_listed}
      - name: empty tasks list
        given: runningBot
        reqs: [CAP#2]
        then:
          events: [TasksListed]
          see:
            - {screen: Chat, field: Reply.text, is: "Задач пока нет."}
      - name: tasks list shows only the sender's tasks
        given: borisAsksAfterAnnasTasks
        reqs: [CAP#2]
        then:
          events: [TasksListed]
          see:
            - {screen: Chat, field: Reply.text, is: "Задач пока нет., in Борис's chat"}
      - name: /tasks is neither an inbox item nor a task
        given: runningBot
        reqs: [CAP#2]
        then:
          events: [TasksListed]
          see:
            - {screen: Inbox, field: InboxItem.text, is: "no inbox item"}
            - {screen: TaskStore, field: Task.text, is: "no task"}
      - name: long tasks list is split into several messages
        given: annaRecordedManyLongTasks
        reqs: [CAP#2]
        then:
          events: [TasksListed]
          see:
            - {screen: Chat, field: Reply.text, is: "several messages, each at most 4096 characters; together «Твои задачи:» and all 40 lines in order"}

  - id: V06
    name: The tasks
    type: view
    reqs: [CAP#1]
    read_model:
      name: Task
      fields:
        user_id: [TaskRecorded.user_id]
        text: [TaskRecorded.text]
        status: [TaskRecorded.status]
        created_at: [TaskRecorded.created_at]
    screens: [TaskStore]

  - id: A01
    name: Report an error to PostHog
    type: automation
    trigger: HandlerFailed
    # No slice-level reqs: its example says which requirement it serves.
    command:
      name: ReportError
      fields: {log_event: system, error_class: system, traceback: system}
    events:
      ErrorReported:
        stream: Server
        fields: {log_event: cmd, error_class: cmd, traceback: cmd}
    specs:
      - name: handler error reaches PostHog without what the user wrote
        given: annaHitAHandlerError
        external: {Database: storingFails, PostHog: takes}
        reqs: [ERR#1]
        then:
          events: [ErrorReported]
          see:
            - {screen: ErrorTracking, field: TrackedEvent.event, is: "$exception, once for the handler_error line"}
            - {screen: ErrorTracking, field: TrackedEvent.log_event, is: handler_error}
            - {screen: ErrorTracking, field: TrackedEvent.error_class, is: "the error type of the handler_error line"}
            - {screen: ErrorTracking, field: TrackedEvent.distinct_id, is: todobot}
            - {screen: ErrorTracking, field: TrackedEvent.person_profile, is: "false"}
            - {screen: ErrorTracking, field: TrackedEvent.version, is: "<APP_VERSION>"}
            - {screen: ErrorTracking, field: TrackedEvent.payload, is: "nothing of «Купить молоко и хлеб» and no 5812345678 anywhere in what PostHog got"}

  - id: V02
    name: The inbox
    type: view
    reqs: [SK#2]
    read_model:
      name: InboxItem
      fields:
        user_id: [InboxSaved.user_id]
        kind: [InboxSaved.kind]
        text: [InboxSaved.text]
        file_id: [InboxSaved.file_id]
        received_at: [InboxSaved.received_at]
    screens: [Inbox]

  # ---------------------------------------------------------------- the operator's side: /healthz and the log
  - id: S03
    name: Ask for the bot's health
    type: command
    actor: Operator
    screen: Healthz
    reqs: [SK#4]
    rules: [health]
    command:
      name: CheckHealth
      fields: {}
    errors: [DatabaseDoesNotAnswer]
    events: {}
    specs:
      - name: /healthz returns ok and version when database answers
        given: runningBot
        external: {Database: answers}
        covers: [rule:health/answers]
        then:
          see:
            - {screen: Healthz, field: Health.http_status, is: 200}
            - {screen: Healthz, field: Health.status, is: ok}
            - {screen: Healthz, field: Health.version, is: "<APP_VERSION>"}
      - name: server starts and /healthz returns 503 when database does not answer
        given: runningBot
        external: {Database: doesNotAnswer}
        covers: [rule:health/does not answer]
        then:
          error: DatabaseDoesNotAnswer
          see:
            - {screen: Healthz, field: Health.http_status, is: 503}
            - {screen: Healthz, field: Health.status, is: error}

  - id: S04
    name: Start the server
    type: command
    actor: Operator
    screen: Log
    # No slice-level reqs: each example says which requirement it serves.
    command:
      name: StartServer
      fields: {}
    errors: []
    events:
      ServerStarted:
        stream: Server
        fields: {}
      TrackingRefused:
        stream: Server
        fields: {}
      AccessRestricted:
        stream: Server
        fields: {}
      AccessOpened:
        stream: Server
        fields: {}
    specs:
      - name: server with an allow list says it is restricted
        given: closedBot
        external: {Database: answers}
        reqs: [ACC#2]
        then:
          events: [ServerStarted, AccessRestricted]
          see:
            - {screen: Log, field: LogLine.event, is: access_restricted}
            - {screen: Log, field: LogLine.allowed, is: 1}
      - name: server without an allow list warns that it is open
        given: runningBot
        external: {Database: answers}
        reqs: [ACC#2]
        then:
          events: [ServerStarted, AccessOpened]
          see:
            - {screen: Log, field: LogLine.event, is: access_open}
            - {screen: Log, field: LogLine.level, is: WARNING}
      - name: server start is announced to PostHog with the version
        given: runningBotWithErrorTracking
        external: {Database: answers, PostHog: takes}
        reqs: [ERR#2]
        then:
          events: [ServerStarted]
          see:
            - {screen: ErrorTracking, field: TrackedEvent.event, is: server_started}
            - {screen: ErrorTracking, field: TrackedEvent.version, is: "<APP_VERSION>"}
            - {screen: ErrorTracking, field: TrackedEvent.distinct_id, is: todobot}
            - {screen: ErrorTracking, field: TrackedEvent.person_profile, is: "false"}
      - name: PostHog refusing leaves the bot running
        given: runningBotWithErrorTracking
        when: {}
        external: {Database: answers, PostHog: refuses}
        reqs: [ERR#3]
        then:
          events: [ServerStarted, TrackingRefused]
          see:
            - {screen: Log, field: LogLine.event, is: posthog_failed}
            - {screen: Log, field: LogLine.level, is: "WARNING on the posthog_failed line, and no line with level ERROR"}
            - {screen: Healthz, field: Health.http_status, is: 200}
            - {screen: Chat, field: Reply.text, is: "Сохранил ✅ for a message Анна sends after the start"}

  - id: V05
    name: Error tracking
    type: view
    reqs: [ERR#1, ERR#2]
    read_model:
      name: TrackedEvent
      fields:
        event: [ServerStarted, ErrorReported]
        log_event: [ErrorReported.log_event]
        error_class: [ErrorReported.error_class]
        distinct_id: [config]
        person_profile: [config]
        version: [config]
        payload: [ServerStarted, ErrorReported]
    screens: [ErrorTracking]

  - id: V03
    name: Health
    type: view
    reqs: [SK#4]
    read_model:
      name: Health
      fields:
        http_status: [rule:health]
        status: [rule:health]
        version: [config]
    screens: [Healthz]

  - id: V04
    name: The log
    type: view
    reqs: [SK#1, SK#2, SK#5, DUP#1, ERR#3, ACC#1, ACC#2, CAP#1, CAP#2]
    read_model:
      name: LogLine
      fields:
        format: [config]
        level: [Started, InboxSaved, HandlerFailed, RepeatIgnored, TrackingRefused, AccessRefused, AccessRestricted, AccessOpened, TaskRecorded, TasksListed]
        event: [Started, InboxSaved, HandlerFailed, RepeatIgnored, TrackingRefused, AccessRefused, AccessRestricted, AccessOpened, TaskRecorded, TasksListed]
        allowed: [config]
        version: [config]
        kind: [InboxSaved.kind]
    screens: [Log]
