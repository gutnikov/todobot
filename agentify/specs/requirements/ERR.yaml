questions:
  - id: ERR?1
    reason: H4
    text: "Where do todobot's errors go? PostHog's free plan allows one project per organization, and the existing one holds another app's events."
    answer: "A new organization, todobot, with its own free project (344747, EU). The owner created it. Decided by the owner, 2026-11-11."
  - id: ERR?2
    reason: H4
    text: "Does the user's Telegram id go to PostHog with an error?"
    answer: "No: one distinct_id, todobot, and no person profiles. Decided by the owner, 2026-11-11."
  - id: ERR?3
    reason: H4
    text: "How does production show that errors reach PostHog, when no error can be forced in a release's window?"
    answer: "serve sends one event server_started with the version at startup; after the release the agent checks PostHog got it; a failed upload shows as a log line. Decided by the owner, 2026-11-11."
