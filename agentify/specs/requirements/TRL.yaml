questions:
  - id: TRL?1
    reason: H4
    text: "Who creates the Trello board with the status lists, and how does the bot get access?"
    answer: "OAuth: the bot sends a link, the owner allows access, and the bot creates the board «todobot» with the five lists, or finds it. Decided by the owner, 2026-11-12."
  - id: TRL?2
    reason: H4
    text: "The tasks already recorded in the database after #14: move them to Trello?"
    answer: "Yes: they become cards in «Записана» once Trello is connected. Decided by the owner, 2026-11-11."
  - id: TRL?3
    reason: H4
    text: "What is the card's name when the task's text has several lines?"
    answer: "The first line; the whole text is the first block of the description, and the agent's note comes after it. Decided by the owner, 2026-11-11."
  - id: TRL?4
    reason: H4
    text: "What does the bot do when Trello is down as a task comes in?"
    answer: "Reply «Сохранил ✅», keep the task in the database and try again once a minute until it reaches Trello; /tasks marks it «ещё не в Trello». Decided by the owner, 2026-11-11."
