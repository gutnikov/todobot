# What agentify found in the project: the facts the map of its super-loops is drawn from. agentify rebuilds them from
# what it sees and never asks for them twice; what only the user can say is in agentify.md next to this file.
#
# The map and the loops are chosen from these facts (agentify's parts/harness/profile.md, "From the profile to the map
# and the loops"). Keep them current: when the project changes, update this file from what you see.
#
# A place is <super-loop>/<phase>, such as delivery/confirmation (agentify's parts/harness/super-loops/README.md).
#
# Found 2026-11-10, after the skeleton (PR #1): a Python 3.12 service in github.com/gutnikov/todobot (public, main),
# deployed to Railway (project todobot, service todobot, region ams) with Postgres on Neon (project todobot,
# twilight-firefly-94202512, aws-eu-central-1). Since PR #2: GitHub Actions (verify and acceptance-gate required on
# main; release-confirmation after each deploy) and a Stop hook (verify, fast). Since PR #5: the service's settings in
# .railway/railway.ts (workflow railway-config). Since PR #7 (2026-11-11): the spec in agentify/specs/ (event model,
# glossary, decision tables, lifecycles) and spec-check, required on main too.
# Found again 2026-11-11 (/agentify set up again): every tool answered one real call, PostHog too (its MCP server);
# todobot sends nothing to PostHog yet.

version: 1

# The project's own commands, as found in the repository.
stack:
  languages: [python]
  build: "uv sync --locked"
  test: "make ci (ruff check, ruff format --check, mypy src, pytest: unit + acceptance against pgserver Postgres)"
  lint: "uv run ruff check && uv run ruff format --check && uv run mypy src"

# Where a change goes after the agent writes it, besides edit, local, commit, task and continuous, which are always
# there. Values from a loop's trigger: ci, scheduled, preview, staging, production.
stages: [ci, production]

# The super-loops the project has work for, each with where its work comes from now. No tracker, error tracker,
# dependency bot or prototypes exist yet; the sources below are the user's.
super_loops:
  delivery: "the user's requests in this Claude Code session; GitHub issues of gutnikov/todobot (none yet)"
  remediation: "bugs the user hits using the bot; Railway logs, read by hand; no alerts"
  maintenance: "uv.lock dependencies; nothing watches them"
not_here:
  discovery: "the user brings each idea and it gets built; no prototypes or decision records"

# Where a change ends now: the last stage it reaches, and what confirms it there.
ends_at: "production on Railway: a push to main that touches the app (watch paths src/, pyproject.toml, uv.lock, Dockerfile, .dockerignore) deploys at once (only PRs with green verify, acceptance-gate and spec-check reach main); release-confirmation judges every such deploy; the service's settings are .railway/railway.ts, applied by the railway-config workflow"

# Where the project's own systems record the exits of its super-loops.
trace:
  - "agentify/releases.jsonl"
  - "GitHub pull requests of gutnikov/todobot: merged only with green required checks"
  - "GitHub Actions runs of release-confirmation: each release's verdict and its snapshot (artifact, 90 days)"

# The checks the project runs besides the loops in agentify/loops/ (verify, acceptance-gate, spec-check,
# release-confirmation), whose LOOP.md places them.
existing_checks:
  - "railway-config: delivery/release — the CI workflow railway-config runs railway config plan of .railway/railway.ts on a pull request that changes it and applies it on main; advisory (not a required check)"
  - "railway healthcheck: delivery/release remediation/release maintenance/release — Railway runs python -m todobot migrate before a deploy and switches traffic only when /healthz answers 200 (.railway/railway.ts)"

# The failures the loops must catch first, from the history.
pains:
  - "user content in logs: delivery/work — message text reached the logs twice in the skeleton (DB errors, invalid updates); caught by a security review and the gate, not by a loop"
  - "release config: delivery/release — the first deploy failed (two regions on the Hobby plan) and the second ran without migrations (railway.json ignored); caught by hand. Then the merge of PR #2 deployed nothing (no Railway deploy trigger; release-confirmation caught it), and PR #5's commit was skipped: Railway waited for the commit's checks, release-confirmation for the deploy (checkSuites off since PR #6)"

# The spec part's facts, filled when specs are set up (agentify's parts/spec/profile.md).
spec:
  docs:
    - "text in the Claude Code session"
    - "GitHub issues of gutnikov/todobot (read with gh, never written)"
    - "the running bot, @sortmyshit_bot, for what already exists"
  running_app: "@sortmyshit_bot in Telegram; https://todobot-production-dbb2ecd7.up.railway.app/healthz"
  readers: [the user, agents]
  e2e: "none: black-box pytest in tests/acceptance, Updates posted to /telegram/webhook, replies read from a fake Bot API"
  seeding: "a fresh Postgres database per test (pgserver or TEST_DATABASE_URL), python -m todobot migrate"
  risks: [integrations, timers, permissions, rules-and-statuses]
