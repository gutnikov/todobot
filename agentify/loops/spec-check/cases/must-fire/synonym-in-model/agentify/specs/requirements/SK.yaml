    reason: H1
    text: "Can /start fail in a way a test can force? SK#5's apology covers every handler, but SK names a trigger only for storing a message, and /start stores nothing. If it cannot, S01 has no failure example and that is recorded; if it can, name the trigger and S01 gets an example."
    answer: ""
  - id: SK?4
    reason: H1
    text: "Is there a deadline for «Сохранил ✅», as SK#1 gives 5 seconds for the greeting? None is given and none is invented; the tests wait up to 10 s. A deadline becomes a `within_seconds` in S02's examples and a test."
    answer: ""
  - id: SK?5
    reason: H1
    text: "Telegram retries a webhook it got no 200 for, so the same update can come twice. One inbox item or two? One adds an example to S02 (the same update twice, one item); two keeps S02 as it is."
    answer: ""
  - id: SK?6
    reason: H1
    text: "What does the bot do when Telegram refuses or fails a reply (sendMessage)? SK does not say, and the tests' fake Bot API always answers ok. An answer adds Telegram's outcomes to the model and an example for each."
    answer: ""
