# The delivery gate (agentify/loops/acceptance-gate/LOOP.md): every approved criterion green on the approved,
# hash-checked acceptance tests, red before the work, and every change to them since the base approved (H5).
# The job `acceptance-gate` is the status check main requires.
name: acceptance-gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  acceptance-gate:
    name: acceptance-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # --base needs the history back to the merge base
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.10.11"
          python-version: "3.12"
      - run: uv sync --locked
      - run: agentify/loops/acceptance-gate/run . --base "origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}
