# The verify loop (agentify/loops/verify/LOOP.md): ruff check, ruff format --check, mypy, all tests (unit and
# acceptance) and the log-privacy rule. The job `verify` is the status check main requires.
name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.10.11"
          python-version: "3.12"
      - run: uv sync --locked
      - run: agentify/loops/verify/run . --full
